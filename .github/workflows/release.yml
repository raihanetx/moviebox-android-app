name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: /tmp/release.keystore
      ANDROID_KEYSTORE_PASSWORD: android
      ANDROID_KEY_ALIAS: androiddebugkey
      ANDROID_KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$ANDROID_KEYSTORE" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -dname "CN=MovieBox, OU=Dev, O=MovieBox, L=Unknown, S=Unknown, C=US"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Get APK path
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MovieBox Downloader v${{ github.run_number }}
          body: |
            ## MovieBox Downloader v${{ github.run_number }}

            **One-click install:** Download the APK below and open it on your Android device.

            ### What's new
            - Full MovieBox downloader UI
            - On-device NSFW content detection
            - Download management with history

            ### Requirements
            - Android 8.0+ (API 26)
            - ARM64 or ARMv7 device
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
